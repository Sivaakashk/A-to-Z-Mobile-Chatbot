<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>A to Z Mobile Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="app-container">

        <header class="header">

            <h1>📱 A to Z Mobile</h1>

            <p>Your AI Mobile Phone Assistant</p>

        </header>


        <main class="chat-container">

            <div
                id="chat-box"
                class="chat-box"
            >

                <div class="message bot-message">

                    <strong>Mobile AI 🤖</strong>

                    <p>
                        Hello! I can help you find the best mobile phone.
                    </p>

                    <p>
                        Ask me things like:
                    </p>

                    <ul>
                        <li>Best phone under ₹30,000</li>
                        <li>Compare iPhone and Samsung</li>
                        <li>Best gaming phone</li>
                        <li>Best camera phone</li>
                    </ul>

                </div>

            </div>


            <div class="input-container">

                <input
                    type="text"
                    id="message-input"
                    placeholder="Ask about any mobile phone..."
                    autocomplete="off"
                >

                <button
                    id="send-button"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </main>

    </div>


    <script
        src="{{ url_for('static', filename='js/chat.js') }}"
    ></script>

</body>
</html>
